name: CI (dev only)

# ============================================================================
#  Проверочная сборка для разработки.
#  НИКОГДА не создаёт релиз, установщик и не трогает релизы на GitHub.
#  Вся установка и автообновление клиентов живут только в build-and-release.yml,
#  который запускается исключительно из ветки master.
# ============================================================================
on:
  push:
    branches:
      - 'integration/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'spike/**'
  pull_request:
    branches:
      - master
      - 'integration/**'

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'PhotoBookRenamer.sln'

jobs:
  build:
    name: Build check
    runs-on: windows-latest

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Full history: the warning step below diffs against the base branch.
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Build project
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-build --nologo

    - name: Check formatting
      run: dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --verbosity minimal

    # Both of these sat in the repository for a long time and had never once run: they
    # looked for dictionaries in <repo>\Styles while the dictionaries live in the WPF
    # project, so Get-ChildItem threw on a directory that is not there. A check that has
    # never run looks exactly like a check that passes, which is worse than not having it.
    - name: "Resource dictionaries: no x:Key declared twice"
      run: pwsh -File scripts/check-resource-keys.ps1

    - name: "Resource dictionaries: every StaticResource resolves"
      run: pwsh -File scripts/check-resource-refs.ps1

    # Re-checks every step the campaign has already closed, against the repository as it is.
    # It exists because step 1.3 was closed on the strength of a type existing and the half
    # nobody looked at sat unnoticed through a whole wave. A step that cannot fail is not a
    # step that was checked.
    - name: "Audit the steps already closed"
      run: pwsh -File scripts/audit-closed-steps.ps1

    # The repository is a portfolio piece and is written in the voice of the product. It
    # carries no trace of how it was produced or of who reviewed it - not in comments, not in
    # file names, not in commit messages. This check is in CI because saying so in a document
    # has already failed: the rule was restated several times and broken anyway, because
    # nobody catches a word in a comment while reading a diff.
    - name: "The repository is written in the voice of the product"
      run: pwsh -File scripts/check-repo-voice.ps1

    - name: Report version
      run: |
        $version = (Select-Xml -Path "src\PhotoBook.Desktop.Wpf\PhotoBook.Desktop.Wpf.csproj" -XPath "//Version").Node.InnerText
        Write-Host "Version in csproj: $version"
        Write-Host "Note: the version is only published to customers when this code is merged into master."

    - name: "Release notes must carry no links"
      run: |
        # The notes are shown in the update dialog and on the release page. Links, account
        # names and markdown the dialog cannot render are rejected here rather than in front
        # of a user. See scripts\check-release-notes.ps1 for the rules.
        pwsh -File scripts/check-release-notes.ps1

    - name: "Warn if the release workflow was touched in this PR"
      if: github.event_name == 'pull_request'
      continue-on-error: true
      run: |
        # This step only produces a review hint. It must never fail the build.
        $base = "${{ github.event.pull_request.base.ref }}"
        $target = "origin/$base"
        git rev-parse --verify $target 2>$null | Out-Null
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::warning::Base ref '$target' is not available locally; skipping the release-workflow diff."
          exit 0
        }
        $changed = git diff --name-only "$target...HEAD" -- '.github/workflows/build-and-release.yml'
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::warning::Could not diff against $target; skipping the release-workflow diff."
          exit 0
        }
        if ($changed) {
          Write-Host "::warning::The release workflow was modified in this PR ($changed). It only takes effect after merge into master, and it decides what is shipped to customers. Review that diff carefully."
        } else {
          Write-Host "Release workflow untouched by this PR."
        }
