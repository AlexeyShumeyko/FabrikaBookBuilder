name: Secret scan

# ============================================================================
#  Поиск секретов в истории и в пулреквестах.
#
#  Репозиторий публичный: токен, попавший в коммит, считается утёкшим, даже если
#  следующий коммит его удалил. Проверка поэтому отдельная и от сборки не зависит:
#  красный скан не должен смешиваться с красной компиляцией, у них разные причины
#  и разные действия.
#
# ============================================================================
on:
  push:
    branches:
      - master
      - 'integration/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'spike/**'
  pull_request:
    branches:
      - master
      - 'integration/**'

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # The whole history, not just the last commit: a secret that was committed and
        # then removed is still leaked, and only a full scan reports it.
        fetch-depth: 0

    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
