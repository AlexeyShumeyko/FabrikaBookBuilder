name: Build and Release

# ============================================================================
#  ВАЖНО: этот workflow собирает РЕЛИЗ и раздаёт его всем клиентам,
#  потому что UpdateService.cs берёт самый свежий не-preview релиз (GetLatest).
#  Любая сборка отсюда = обновление у всех установленных программ.
#
#  Поэтому сборка разрешена ТОЛЬКО из ветки master.
#  Вся разработка ведётся в develop / feature/* / fix/* / hotfix/*.
#  Никогда не добавляйте сюда другие ветки.
# ============================================================================
on:
  push:
    branches:
      - master
    # Docs/CI-only merges do not need a release, and a release always requires
    # a version bump in PhotoBookRenamer.csproj, which is NOT ignored here.
    # So this can never skip a real release - it only avoids a guaranteed-to-fail
    # run when only documentation or workflow files changed.
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'ВНИМАНИЕ: сборка релиза раздаст обновление всем клиентам. Введите RELEASE, чтобы подтвердить'
        required: true
        default: ''
        type: string

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_NAME: 'PhotoBookRenamer'
  SOLUTION_FILE: 'PhotoBookRenamer.sln'
  PRODUCTION_BRANCH: 'master'
  REPOSITORY: 'AlexeyShumeyko/FabrikaBookBuilder'

jobs:
  build:
    name: Build and publish release
    runs-on: windows-latest

    # Строгая сериализация: релиз нельзя прервать на середине, иначе у клиентов
    # может остаться «половинчатая» загрузка. Новые запуски выстраиваются в очередь.
    concurrency:
      group: build-and-release
      cancel-in-progress: false

    # Второй рубеж защиты (первый — фильтр branches выше).
    # Даже если фильтр по ошибке расширят, сборка не запустится не из master.
    if: >-
      github.repository == 'AlexeyShumeyko/FabrikaBookBuilder' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm == 'RELEASE'))

    permissions:
      contents: write

    steps:
    - name: "Guard: verify production branch and repository"
      run: |
        Write-Host "Repository: ${{ env.REPOSITORY }}"
        Write-Host "Ref:        ${{ github.ref }}"
        Write-Host "Event:      ${{ github.event_name }}"
        if ($env:GITHUB_REPOSITORY -ne "AlexeyShumeyko/FabrikaBookBuilder") {
          Write-Error "Wrong repository. Refusing to release."
          exit 1
        }
        if ($env:GITHUB_REF -ne "refs/heads/master") {
          Write-Error "Not on master ($env:GITHUB_REF). Refusing to release to customers."
          exit 1
        }
        if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and "${{ inputs.confirm }}" -ne 'RELEASE') {
          Write-Error "Manual run not confirmed. Type RELEASE in the 'confirm' input."
          exit 1
        }
        Write-Host "Guard passed. Proceeding with release build."

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Get version from project
      id: get_version
      run: |
        $version = (Select-Xml -Path "PhotoBookRenamer.csproj" -XPath "//Version").Node.InnerText
        Write-Host "Version from csproj: $version"
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: "Guard: version must be new and must not already be released"
      # The token has to be mapped into the step explicitly. Reading $env:GITHUB_TOKEN
      # without this line sends an empty "Bearer" and the API answers 401 - the step then
      # dies on the HTTP call with a message that says nothing about versions. That is
      # exactly how the 1.1.0 release failed: the guard never got to check anything.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $version = "${{ env.VERSION }}"
        $headers = @{
          "Authorization"  = "Bearer $env:GITHUB_TOKEN"
          "Accept"         = "application/vnd.github+json"
          "X-GitHub-Api-Version" = "2022-11-28"
          "User-Agent"     = "build-and-release"
        }

        try {
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/AlexeyShumeyko/FabrikaBookBuilder/releases?per_page=100" -Headers $headers -Method Get
        }
        catch {
          # Say what actually went wrong. A bare failure here reads like "the version is
          # wrong" and sends the next person hunting in the wrong place.
          Write-Error "Could not read published releases from the GitHub API: $($_.Exception.Message)"
          Write-Error "If this says 401, the step is missing its GITHUB_TOKEN env mapping."
          exit 1
        }

        foreach ($r in $releases) {
          if ($r.tag_name -eq "v$version") {
            Write-Error "Release v$version already exists. Bump <Version> in PhotoBookRenamer.csproj before pushing to master."
            exit 1
          }
        }

        $newVersion = [Version]$version
        $latest = $releases | Where-Object { -not $_.prerelease -and -not $_.draft } | Select-Object -First 1
        if ($latest) {
          $latestVersion = [Version]($latest.tag_name.TrimStart('v'))
          Write-Host "Latest published: $($latest.tag_name)"
          if ($newVersion -le $latestVersion) {
            Write-Error "Version $version is not greater than the latest published release $($latest.tag_name). UpdateService.GetLatest() takes the newest release, so a lower version would never reach clients and would corrupt release history."
            exit 1
          }
        }
        Write-Host "Version $version is new and greater than published releases. OK."

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Build project
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore /p:Version=${{ env.VERSION }}

    - name: Publish application
      run: |
        dotnet publish ${{ env.SOLUTION_FILE }} `
          --configuration Release `
          --output ./publish `
          --self-contained true `
          --runtime win-x64 `
          /p:PublishSingleFile=true `
          /p:IncludeNativeLibrariesForSelfExtract=true `
          /p:Version=${{ env.VERSION }}' + "`r`n" + @'

        # Inno Setup takes the installer icon from publish\icon.ico, and the SDK does not
        # put it there: the file is also declared as a WPF Resource, so it ends up embedded
        # in the assembly and the publish folder has no icon at all. The 1.1.0 release
        # died on exactly that, with a message about a missing file and no hint that the
        # icon was the cause. Copy it explicitly and fail here, loudly, if it is nowhere.
        if (-not (Test-Path ".\publish\icon.ico")) {
          Copy-Item ".\icon.ico" ".\publish\icon.ico" -Force
        }
        if (-not (Test-Path ".\publish\icon.ico")) {
          Write-Error "icon.ico is in neither the publish output nor the repository root"
          exit 1
        }
    - name: Install Inno Setup
      run: |
        # jrsoftware.org stopped serving /is/6/<version>.exe: every one of those URLs now
        # answers 404, so the release failed here too. The current Inno Setup is published
        # as a GitHub release, and 6.7.3 is the one that installs to
        # "Program Files (x86)\Inno Setup 6" - the path the build step below already looks in.
        $innoUrl = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
        $innoPath = "$env:TEMP\innosetup.exe"
        Write-Host "Downloading Inno Setup from $innoUrl"
        Invoke-WebRequest -Uri $innoUrl -OutFile $innoPath -UseBasicParsing
        Write-Host "Installing Inno Setup silently..."
        Start-Process -FilePath $innoPath -ArgumentList "/SILENT /SUPPRESSMSGBOXES /NORESTART" -Wait

        # Do not guess how long the installer needs. Wait for the compiler to appear:
        # a fixed sleep that is too short fails the release for no visible reason, which
        # is the same class of bug as the missing token above.
        $isccCandidates = @(
          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
          "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
          "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
          "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
        )
        $deadline = (Get-Date).AddSeconds(120)
        $iscc = $null
        while ((Get-Date) -lt $deadline) {
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($iscc) { break }
          Start-Sleep -Seconds 2
        }
        if (-not $iscc) {
          Write-Error "Inno Setup installed but ISCC.exe never appeared. Looked in:"
          $isccCandidates | ForEach-Object { Write-Host "  $_" }
          exit 1
        }
        Write-Host "Inno Setup ready: $iscc"

    - name: Create installer script (Inno Setup)
      run: |
        $issScript = @"
        [Setup]
        AppId={{8B8E5F3C-5F3C-4B8E-9F3C-5F3C4B8E9F3C}
        AppName=Fabrika BookBuilder Studio
        AppVersion=${{ env.VERSION }}
        AppPublisher=Fabrika
        AppPublisherURL=https://github.com/AlexeyShumeyko/FabrikaBookBuilder
        DefaultDirName={autopf}\Fabrika BookBuilder Studio
        DefaultGroupName=Fabrika BookBuilder Studio
        OutputDir=.
        OutputBaseFilename=BookBuilder-Studio-Setup-${{ env.VERSION }}
        Compression=lzma2
        SolidCompression=yes
        SetupIconFile=publish\icon.ico
        UninstallDisplayIcon={app}\PhotoBookRenamer.exe
        PrivilegesRequired=admin
        LicenseFile=
        InfoBeforeFile=
        InfoAfterFile=

        [Languages]
        Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"

        [Tasks]
        Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked
        Name: "quicklaunchicon"; Description: "{cm:CreateQuickLaunchIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked; OnlyBelowVersion: 6.1

        [Files]
        Source: "publish\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

        [Icons]
        Name: "{group}\Fabrika BookBuilder Studio"; Filename: "{app}\PhotoBookRenamer.exe"; IconFilename: "{app}\icon.ico"
        Name: "{group}\{cm:UninstallProgram,Fabrika BookBuilder Studio}"; Filename: "{uninstallexe}"
        Name: "{autodesktop}\Fabrika BookBuilder Studio"; Filename: "{app}\PhotoBookRenamer.exe"; IconFilename: "{app}\icon.ico"; Tasks: desktopicon
        Name: "{userappdata}\Microsoft\Internet Explorer\Quick Launch\Fabrika BookBuilder Studio"; Filename: "{app}\PhotoBookRenamer.exe"; IconFilename: "{app}\icon.ico"; Tasks: quicklaunchicon

        [Run]
        Filename: "{app}\PhotoBookRenamer.exe"; Description: "{cm:LaunchProgram,Fabrika BookBuilder Studio}"; Flags: nowait postinstall skipifsilent
        "@
        $issScript | Out-File -FilePath ./installer.iss -Encoding UTF8

    - name: Build installer with Inno Setup
      run: |
        # Ищем Inno Setup в стандартных местах установки
        $innoPaths = @(
          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
          "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
        )

        $innoPath = $null
        foreach ($path in $innoPaths) {
          if (Test-Path $path) {
            $innoPath = $path
            break
          }
        }

        if ($null -eq $innoPath) {
          # Пробуем найти через PATH
          $found = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($found) {
            $innoPath = $found.Source
          }
        }

        if ($null -eq $innoPath) {
          Write-Error "Inno Setup not found. Tried paths: $($innoPaths -join ', ')"
          Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "*Inno*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          Get-ChildItem "${env:ProgramFiles}" -Filter "*Inno*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          exit 1
        }

        Write-Host "Using Inno Setup at: $innoPath"
        & $innoPath installer.iss

    - name: Create release notes
      id: release_notes
      run: |
        # Hand-written notes win. They are the text the program shows after an update,
        # so "обновления из последнего коммита" is worse than useless there - it is what
        # a client reads to decide whether the update is worth installing now.
        # Convention: docs/release-notes/v<version>.md. No file -> a factual list of
        # commits, never an invented summary.
        $hand = "./docs/release-notes/v${{ env.VERSION }}.md"

        if (Test-Path $hand) {
          Write-Host "Using hand-written release notes: $hand"
          Copy-Item $hand ./release-notes.md
        }
        else {
          Write-Host "No hand-written notes at $hand - falling back to the commit list."
          $range = "${{ env.GITHUB_SHA }}^..${{ env.GITHUB_SHA }}"
          $lines = @(git log $range --pretty=format:"- %s" 2>$null)
          $notes = "## Версия ${{ env.VERSION }}`n`n"
          $notes += "_Заметки к релизу не были подготовлены, список изменений из истории коммитов._`n`n"
          if ($lines.Count -gt 0) {
            $notes += "### Изменения`n"
            $notes += ($lines -join "`n")
            $notes += "`n"
          }
          else {
            $notes += "### Изменения`n- Сборка ${{ env.VERSION }}`n"
          }
          $notes | Out-File -FilePath ./release-notes.md -Encoding UTF8
        }

    - name: Find installer file and create ZIP
      id: find_installer
      run: |
        $installerExe = Get-ChildItem -Path . -Filter "BookBuilder-Studio-Setup-${{ env.VERSION }}.exe" -ErrorAction SilentlyContinue
        if (-not $installerExe) {
          Write-Error "Installer .exe file not found"
          exit 1
        }

        # Создаём ZIP архив с установщиком (без версии в названии)
        $zipFileName = "BookBuilder-Studio-Setup.zip"
        Compress-Archive -Path $installerExe.FullName -DestinationPath $zipFileName -Force

        echo "INSTALLER_EXE=$($installerExe.Name)" >> $env:GITHUB_ENV
        echo "INSTALLER_EXE=$($installerExe.Name)" >> $env:GITHUB_OUTPUT
        echo "INSTALLER_ZIP=$zipFileName" >> $env:GITHUB_ENV
        echo "INSTALLER_ZIP=$zipFileName" >> $env:GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: Release v${{ env.VERSION }}
        body_path: ./release-notes.md
        files: |
          ${{ env.INSTALLER_ZIP }}
        draft: false
        prerelease: false
        generate_release_notes: true

    - name: Update previous releases with new installer
      run: |
        $token = "${{ secrets.GITHUB_TOKEN }}"
        $owner = "AlexeyShumeyko"
        $repo = "FabrikaBookBuilder"
        $newInstallerZip = "${{ env.INSTALLER_ZIP }}"
        $newInstallerExe = "${{ env.INSTALLER_EXE }}"
        $currentVersion = "${{ env.VERSION }}"

        # Получаем все релизы через GitHub API
        $headers = @{
          "Authorization" = "Bearer $token"
          "Accept" = "application/vnd.github+json"
          "X-GitHub-Api-Version" = "2022-11-28"
        }

        Write-Host "Fetching all releases..."
        $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$owner/$repo/releases" -Headers $headers -Method Get

        # Обновляем каждый предыдущий релиз
        foreach ($release in $releases) {
          if ($release.tag_name -eq "v$currentVersion") {
            Write-Host "Skipping current release: $($release.tag_name)"
            continue
          }

          Write-Host "Updating release: $($release.tag_name)"

          # Удаляем старые установщики из релиза (с версией и без)
          foreach ($asset in $release.assets) {
            if ($asset.name -like "BookBuilder-Studio-Setup*.zip" -or $asset.name -like "BookBuilder-Studio-Setup*.exe") {
              Write-Host "Deleting old asset: $($asset.name)"
              Invoke-RestMethod -Uri $asset.url -Headers $headers -Method Delete
            }
          }

          # Загружаем новый установщик в этот релиз
          Write-Host "Uploading new installer to release: $($release.tag_name)"
          $uploadUrl = $release.upload_url -replace '\{.*\}', "?name=$newInstallerZip"

          try {
            $fileContent = [System.IO.File]::ReadAllBytes($newInstallerZip)
            $uploadHeaders = @{
              "Authorization" = "Bearer $token"
              "Accept" = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
              "Content-Type" = "application/zip"
            }

            # Загружаем файл напрямую
            Invoke-RestMethod -Uri $uploadUrl -Headers $uploadHeaders -Method Post -Body $fileContent
            Write-Host "Successfully updated release: $($release.tag_name)"
          } catch {
            Write-Host "Error updating release $($release.tag_name): $($_.Exception.Message)"
            # Не прерываем выполнение, если не удалось обновить старый релиз
          }
        }
